name: ci

# Every pull request and push to main: the unit tests, and the network test, which loads the engine's nightly web
# build from GitHub Releases and creates an engine in Node (no model is downloaded or run). And the macOS app: built
# with the native engine compiled in, checked, and packed as an unsigned .dmg kept as an artifact.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
        env:
          PLAYGROUND_NETWORK: "1"

  # On every run, not only when src-tauri/ changes: the app embeds web/, so a change to the page is a change to the
  # app, and a path filter would spare only the PRs that touch nothing but docs.
  macos:
    name: macOS app (Apple silicon) .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Toolchain (src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      # The engine at the commit Cargo.lock pins, for its own `cargo xtask sherpa-libs`: sherpa-onnx's static
      # libraries for this machine, checked against the digests the engine pins, kept outside target/ and linked
      # through SHERPA_ONNX_LIB_DIR (which the command writes to $GITHUB_ENV), so no build script downloads anything
      # unchecked.
      - name: The engine at the commit Cargo.lock pins
        id: engine
        run: |
          set -euo pipefail
          SOURCE=$(grep -o '"git+https://github.com/sidevoice/sidevoice-engine[^"]*"' src-tauri/Cargo.lock | head -1)
          REV=${SOURCE##*#}; REV=${REV%\"}
          [ ${#REV} = 40 ] || { echo "no sidevoice-engine commit in src-tauri/Cargo.lock: $SOURCE"; exit 1; }
          DIR="$RUNNER_TEMP/sidevoice-engine"
          rm -rf "$DIR" && git init -q "$DIR"
          git -C "$DIR" fetch -q --depth 1 https://github.com/sidevoice/sidevoice-engine "$REV"
          git -C "$DIR" checkout -q FETCH_HEAD
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sidevoice-engine/sherpa-onnx
          key: sherpa-onnx-libs-${{ runner.os }}-${{ runner.arch }}-${{ steps.engine.outputs.rev }}
      # From src-tauri, so the pinned toolchain builds the xtask too; without its default features it does not build
      # the engine (nor sherpa-onnx-sys) before the libraries are there.
      - name: sherpa-onnx's libraries (the engine's cargo xtask sherpa-libs)
        working-directory: src-tauri
        env:
          ENGINE: ${{ steps.engine.outputs.dir }}
        run: cargo run --quiet --locked --manifest-path "$ENGINE/xtask/Cargo.toml" --no-default-features -- sherpa-libs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: rustfmt, clippy, tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the app
        run: npm run tauri -- build --ci --bundles app
      - name: Check the app
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Sidevoice Playground.app"
          BIN="$APP/Contents/MacOS/sidevoice-playground"
          lipo -archs "$BIN" | tee /dev/stderr | grep -qx arm64
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The engine it was built with is the one Cargo.lock pins.
          grep -q "${{ steps.engine.outputs.rev }}" "$BIN"
          # It starts and stays up: the window, the page and the native engine on its NativeHost.
          "$BIN" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then echo "the app exited on its own:"; cat "$RUNNER_TEMP/app.log"; exit 1; fi
          kill "$PID"
          cat "$RUNNER_TEMP/app.log"
      - name: Make the .dmg
        id: dmg
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Sidevoice Playground.app"
          REV="${{ steps.engine.outputs.rev }}"
          DMG="dist/sidevoice-playground_engine-${REV:0:7}_aarch64.dmg"
          ROOT="$RUNNER_TEMP/dmg"
          mkdir -p "$ROOT" dist
          ditto "$APP" "$ROOT/Sidevoice Playground.app"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname "Sidevoice Playground" -srcfolder "$ROOT" -fs HFS+ -format UDZO -ov "$DMG"
          hdiutil verify "$DMG"
          ls -l "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidevoice-playground-macos-aarch64
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
