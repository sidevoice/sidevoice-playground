name: ci

# Every pull request and push to main: the unit tests, and the network test, which loads the engine's nightly web
# build from GitHub Releases and creates an engine in Node (no model is downloaded or run). And the macOS app: built,
# checked, and packed as an unsigned .dmg kept as an artifact; and the native runner template it ships, built against
# sidevoice-engine's main as the app builds it on a Mac, so a template that no longer builds is caught here. On main,
# the .dmg then replaces the `nightly` pre-release's.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run; main's runs queue instead, so a nightly is never cut off half
# published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
        env:
          PLAYGROUND_NETWORK: "1"

  # On every run, not only when src-tauri/ changes: the app embeds web/, so a change to the page is a change to the
  # app, and a path filter would spare only the PRs that touch nothing but docs.
  macos:
    name: macOS app (Apple silicon) .dmg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Toolchain (src-tauri/rust-toolchain.toml)
        working-directory: src-tauri
        run: |
          set -euo pipefail
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: rustfmt, clippy, tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the app
        run: npm run tauri -- build --ci --bundles app
      - name: Check the app
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Sidevoice Playground.app"
          BIN="$APP/Contents/MacOS/sidevoice-playground"
          lipo -archs "$BIN" | tee /dev/stderr | grep -qx arm64
          plutil -extract NSMicrophoneUsageDescription raw "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The runner template ships with it, its build script included.
          test -f "$APP/Contents/Resources/runner/build.sh"
          test -f "$APP/Contents/Resources/runner/Cargo.toml.in"
          # It starts and stays up: the window and the page.
          "$BIN" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then echo "the app exited on its own:"; cat "$RUNNER_TEMP/app.log"; exit 1; fi
          kill "$PID"
          cat "$RUNNER_TEMP/app.log"
      - name: Make the .dmg
        id: dmg
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Sidevoice Playground.app"
          DMG="dist/sidevoice-playground_${GITHUB_SHA:0:7}_aarch64.dmg"
          ROOT="$RUNNER_TEMP/dmg"
          mkdir -p "$ROOT" dist
          ditto "$APP" "$ROOT/Sidevoice Playground.app"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname "Sidevoice Playground" -srcfolder "$ROOT" -fs HFS+ -format UDZO -ov "$DMG"
          hdiutil verify "$DMG"
          ls -l "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sidevoice-playground-macos-aarch64
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      # The runner template against sidevoice-engine's main, by the script the app runs (runner/build.sh), with the
      # runner's stable Rust as a Mac has it; then its own tests, and the protocol spoken to it (no model downloaded
      # or run).
      - name: The native runner against sidevoice-engine main
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          REV=$(git ls-remote https://github.com/sidevoice/sidevoice-engine refs/heads/main | cut -f1)
          OUT="$RUNNER_TEMP/runner"
          cd "$RUNNER_TEMP"
          RUSTUP_TOOLCHAIN=stable sh "$GITHUB_WORKSPACE/src-tauri/runner/build.sh" "$REV" "$OUT"
          RUSTUP_TOOLCHAIN=stable cargo test --release --manifest-path "$OUT/Cargo.toml"
          printf '%s\n' '{"id":1,"op":"hello"}' '{"id":2,"op":"models"}' '{"id":3,"op":"nope"}' \
            | "$OUT/bin/sidevoice-engine-runner" --data-dir "$RUNNER_TEMP/engine-data" > "$RUNNER_TEMP/answers"
          cat "$RUNNER_TEMP/answers"
          grep -q "\"id\":1,\"ok\":{.*\"rev\":\"$REV\"" "$RUNNER_TEMP/answers"
          grep -q '"id":2,"ok":\[{' "$RUNNER_TEMP/answers"
          grep -q '"error":{"code":"bad-request".*"id":3' "$RUNNER_TEMP/answers"

  # main's newest app, at a stable URL: the `nightly` pre-release, its tag moved to the commit built, its assets
  # replaced by this run's .dmg (always named sidevoice-playground_aarch64.dmg) and a SHA256SUMS.
  # https://github.com/sidevoice/sidevoice-playground/releases/download/nightly/sidevoice-playground_aarch64.dmg
  nightly:
    name: Publish the nightly pre-release
    needs: macos
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DMG: sidevoice-playground_aarch64.dmg
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sidevoice-playground-macos-aarch64
          path: built
      - name: The assets
        run: |
          set -euo pipefail
          mkdir dist
          FOUND=(built/*.dmg)
          [ ${#FOUND[@]} = 1 ] || { echo "expected one .dmg, found: ${FOUND[*]}"; exit 1; }
          mv "${FOUND[0]}" "dist/$DMG"
          (cd dist && sha256sum "$DMG" > SHA256SUMS && cat SHA256SUMS)
      - name: Move the nightly tag to this commit
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/refs/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Replace the nightly pre-release's assets
        run: |
          set -euo pipefail
          NOTES="The macOS app (Apple silicon) built from main at $GITHUB_SHA ($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA), by run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID. Unsigned: after installing, run xattr -dr com.apple.quarantine \"/Applications/Sidevoice Playground.app\" (README, \"Opening the unsigned .dmg\")."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "nightly" --notes "$NOTES"
          else
            gh release create nightly --prerelease --verify-tag --title "nightly" --notes "$NOTES"
          fi
          gh release upload nightly "dist/$DMG" dist/SHA256SUMS --clobber
          # Whatever else an earlier nightly left.
          for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
            case "$asset" in "$DMG" | SHA256SUMS) ;; *) gh release delete-asset nightly "$asset" --yes ;; esac
          done
          gh release view nightly --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'
